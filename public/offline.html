<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b10" />
  <title>Relay · Offline</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      box-sizing: border-box;
      background: #080b10;
      color: #e6edf5;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 340px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { margin: 16px 0 6px; font-size: 20px; }
    p { margin: 0 0 20px; color: #9aa7b6; }
    button {
      min-height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: #5fa8ff;
      color: #06111f;
      font: 600 15px system-ui, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Relay needs a connection to load your trips and dispatches. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
